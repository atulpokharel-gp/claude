# Upstream Agent Control server, run alongside the Zinloop stack.
#
# This is the real, unmodified Apache-2.0 project from
# https://github.com/agentcontrol/agent-control, pulled as published Docker Hub
# images. We do NOT fork or vendor its source: this file only wires their images
# into our deploy layout so you can stand up their server and dashboard next to
# Zinloop's own Agent Control Plane (console/db/migrations/020_agent_control_plane.sql).
#
# See ./README.md for how the two relate, the security must-dos, and attribution.
#
#   cd deploy/agent-control
#   cp .env.example .env   # then fill in the API keys and DB password
#   docker compose up -d
#   curl http://localhost:${AGENT_CONTROL_SERVER_HOST_PORT:-8000}/health
#
# The dashboard/UI is served by the server at the same host:port.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent_control_postgres
    restart: unless-stopped
    # Default to 15432 on the host so this never collides with another Postgres
    # (the Zinloop stack's own db exposes no host port, but a dev box often has
    # 5432 taken). Containers still talk to each other on 5432 over the network.
    ports:
      - "${AGENT_CONTROL_DB_HOST_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: agent_control
      POSTGRES_USER: agent_control
      POSTGRES_PASSWORD: "${AGENT_CONTROL_POSTGRES_PASSWORD:?set AGENT_CONTROL_POSTGRES_PASSWORD in .env}"
    volumes:
      - agent_control_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_control -d agent_control"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  server:
    # Upstream publishes amd64 only; keep the pin so it runs on arm64 hosts too.
    platform: linux/amd64
    image: galileoai/agent-control-server:latest
    container_name: agent_control_server
    restart: unless-stopped
    ports:
      - "${AGENT_CONTROL_SERVER_HOST_PORT:-8000}:8000"
    environment:
      AGENT_CONTROL_DB_URL: "postgresql+psycopg://agent_control:${AGENT_CONTROL_POSTGRES_PASSWORD:?set AGENT_CONTROL_POSTGRES_PASSWORD in .env}@postgres:5432/agent_control"
      AGENT_CONTROL_HOST: 0.0.0.0
      AGENT_CONTROL_PORT: 8000
      # LEAVE API KEYS ON. With keys disabled the server accepts any caller,
      # which is dangerous for anything but a throwaway local demo.
      AGENT_CONTROL_API_KEY_ENABLED: ${AGENT_CONTROL_API_KEY_ENABLED:-true}
      AGENT_CONTROL_API_KEYS: ${AGENT_CONTROL_API_KEYS:?set AGENT_CONTROL_API_KEYS in .env}
      AGENT_CONTROL_ADMIN_API_KEYS: ${AGENT_CONTROL_ADMIN_API_KEYS:?set AGENT_CONTROL_ADMIN_API_KEYS in .env}
      AGENT_CONTROL_SESSION_SECRET: ${AGENT_CONTROL_SESSION_SECRET:?set AGENT_CONTROL_SESSION_SECRET in .env}
      AGENT_CONTROL_CORS_ORIGINS: ${AGENT_CONTROL_CORS_ORIGINS:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  agent_control_pgdata:
