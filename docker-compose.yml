# Runs Zinloop on one server: Postgres, the console, background jobs, nightly
# backups and Caddy for HTTPS. Staging and production are two servers running
# this same file with their own .env (see docs/deploy.md).
# 1. cp .env.example .env and fill it in
# 2. docker compose up -d --build   (or let the deploy workflow pull images)

# Keep container logs from filling the disk: 5 files of 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The console, migrations and jobs share one image. Deploys set CONSOLE_IMAGE
# to a tested image from GitHub's registry; without it, it's built here.
x-console: &console
  image: ${CONSOLE_IMAGE:-zinloop-console:local}
  build: ./console
  env_file: .env
  logging: *logging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zinloop_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      POSTGRES_DB: zinloop
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zinloop_owner -d zinloop"]
      interval: 5s
      retries: 20
    logging: *logging

  migrate:
    <<: *console
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npm run db:migrate &&
             node -e \"const pg=require('pg');const c=new pg.Client(process.env.DATABASE_ADMIN_URL);c.connect().then(()=>c.query('alter role zinloop_app login password ' + c.escapeLiteral(process.env.DB_APP_PASSWORD))).then(()=>c.end())\""
    restart: "no"

  console:
    <<: *console
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  maintenance:
    <<: *console
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Every 5 minutes: send queued emails. Every hour: fire scheduled client
    # reports whose next_run_at has passed. Once a day: delete expired sessions
    # and old scans, re-check Microsoft 365, save each client's risk counts for
    # the trend chart, and queue the weekly summary (one per person per week).
    command: >
      sh -c 'i=0; while true; do
               if [ $$((i % 288)) -eq 0 ]; then
                 npm run --silent db:cleanup; npm run --silent m365:sync;
                 npm run --silent db:snapshot; npm run --silent mail:weekly;
               fi;
               if [ $$((i % 12)) -eq 0 ]; then
                 npm run --silent mail:schedules;
               fi;
               npm run --silent mail:send; i=$$((i + 1)); sleep 300;
             done'

  # Nightly pg_dump to the backups volume (kept BACKUP_KEEP_DAYS), plus an
  # encrypted off-site copy when BACKUP_S3_URI is set. See docs/deploy.md.
  backup:
    build: ./deploy/backup
    image: ${BACKUP_IMAGE:-zinloop-backup:local}
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - backups:/backups
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      CONSOLE_HOST: ${CONSOLE_HOST:?set CONSOLE_HOST in .env, e.g. app.zinloop.com}
    command: caddy reverse-proxy --from ${CONSOLE_HOST} --to console:3000
    volumes:
      - caddy:/data
    depends_on:
      console:
        condition: service_healthy
    logging: *logging

  # Upstream Agent Control server (Apache-2.0, github.com/agentcontrol/agent-control),
  # pulled as its published image. It has its OWN Postgres so none of its tables
  # ever touch the RLS-protected tenant database in `db`. See deploy/agent-control/
  # README.md for how it relates to Zinloop's native control plane and the security
  # notes. The dashboard binds to localhost by default: set AGENT_CONTROL_BIND to
  # 0.0.0.0 (or add a Caddy route) to expose it.
  agent-control-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_control
      POSTGRES_USER: agent_control
      POSTGRES_PASSWORD: ${AGENT_CONTROL_POSTGRES_PASSWORD:?set AGENT_CONTROL_POSTGRES_PASSWORD in .env}
    volumes:
      - agent_control_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_control -d agent_control"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  agent-control:
    platform: linux/amd64
    image: galileoai/agent-control-server:latest
    restart: unless-stopped
    ports:
      - "${AGENT_CONTROL_BIND:-127.0.0.1}:${AGENT_CONTROL_SERVER_HOST_PORT:-8000}:8000"
    environment:
      AGENT_CONTROL_DB_URL: "postgresql+psycopg://agent_control:${AGENT_CONTROL_POSTGRES_PASSWORD:?set AGENT_CONTROL_POSTGRES_PASSWORD in .env}@agent-control-db:5432/agent_control"
      AGENT_CONTROL_HOST: 0.0.0.0
      AGENT_CONTROL_PORT: 8000
      # Keep API keys on. Keyless means any caller is trusted.
      AGENT_CONTROL_API_KEY_ENABLED: ${AGENT_CONTROL_API_KEY_ENABLED:-true}
      AGENT_CONTROL_API_KEYS: ${AGENT_CONTROL_API_KEYS:?set AGENT_CONTROL_API_KEYS in .env}
      AGENT_CONTROL_ADMIN_API_KEYS: ${AGENT_CONTROL_ADMIN_API_KEYS:?set AGENT_CONTROL_ADMIN_API_KEYS in .env}
      AGENT_CONTROL_SESSION_SECRET: ${AGENT_CONTROL_SESSION_SECRET:?set AGENT_CONTROL_SESSION_SECRET in .env}
      AGENT_CONTROL_CORS_ORIGINS: ${AGENT_CONTROL_CORS_ORIGINS:-http://localhost:8000}
    depends_on:
      agent-control-db:
        condition: service_healthy
    logging: *logging

volumes:
  db:
  caddy:
  backups:
  agent_control_pgdata:
