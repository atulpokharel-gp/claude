name: vercel

# Hosts the console on Vercel with a managed Postgres (e.g. Neon). Every commit
# on main that passes CI: run database migrations, then build and deploy to
# Vercel production. Run it by hand from the Actions tab too.
# Vercel's own Git deploys are off (console/vercel.json) so migrations always
# run first. Set up once by hand, see docs/vercel.md; until VERCEL_TOKEN is set
# this job skips and nothing breaks.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: vercel
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
      DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
      CONSOLE_URL: ${{ vars.CONSOLE_URL }}
    steps:
      - id: setup
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN isn't set in the vercel environment, so nothing was deployed. See docs/vercel.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$DATABASE_ADMIN_URL" ] || [ -z "$DB_APP_PASSWORD" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Set DATABASE_ADMIN_URL, DB_APP_PASSWORD (secrets) and VERCEL_ORG_ID, VERCEL_PROJECT_ID (variables). See docs/vercel.md."
            exit 1
          fi
      - if: steps.setup.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.setup.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Migrate the database
        if: steps.setup.outputs.skip != 'true'
        working-directory: console
        run: |
          npm ci
          # The owner must see every MSP's rows for the background jobs, so it
          # needs BYPASSRLS (Neon's default owner role should have it).
          node -e "const pg=require('pg');const c=new pg.Client(process.env.DATABASE_ADMIN_URL);c.connect().then(()=>c.query('select rolsuper or rolbypassrls as ok from pg_roles where rolname = current_user')).then(r=>{if(!r.rows[0].ok){console.error('The DATABASE_ADMIN_URL role needs BYPASSRLS. See docs/vercel.md.');process.exit(1)}return c.end()})"
          npm run db:migrate
          node -e "const pg=require('pg');const c=new pg.Client(process.env.DATABASE_ADMIN_URL);c.connect().then(()=>c.query('alter role zinloop_app login password ' + c.escapeLiteral(process.env.DB_APP_PASSWORD))).then(()=>c.end())"
      - name: Build and deploy to Vercel
        if: steps.setup.outputs.skip != 'true'
        run: |
          npx --yes vercel@62.7.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@62.7.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@62.7.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Check it's healthy
        if: steps.setup.outputs.skip != 'true' && env.CONSOLE_URL != ''
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$CONSOLE_URL/api/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::$CONSOLE_URL/api/health didn't answer OK. Roll back in Vercel (Deployments → previous → Promote)."
          exit 1
