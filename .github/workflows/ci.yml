name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest stable Go, so builds carry current security fixes.
          go-version: stable
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Check dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Cross-build for Windows, Mac and Linux
        run: |
          for target in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/zinloop
          done

  # Runs the tests on real Windows and macOS, including moving keys into
  # Windows Credential Manager and the macOS Keychain and starting a server
  # through the launcher. Fake keys only; they are deleted afterwards.
  scanner-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A transient macOS runner-acquisition failure ("not acquired by Runner",
    # arm64 capacity) is GitHub infrastructure, not our code, and must not fail
    # CI and block the deploy. Windows stays required; a real macOS regression
    # still shows as a failed check, it just no longer gates the pipeline.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - name: Tests, including the real password store
        env:
          ZINLOOP_REAL_STORE: "1"
        run: go test -v -run "TestRealPasswordStore" ./cmd/zinloop && go test ./...
      - name: Build and run a read-only scan of the test configs
        shell: bash
        run: |
          go build -o zinloop-test${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/zinloop
          ./zinloop-test --home testdata/home --project testdata/project

  console:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Database tests create and drop their own database on this server.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build # also generates next-env.d.ts, which typecheck needs
      - run: npm run typecheck

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the console and backup images
        run: |
          docker build -t zinloop-console console
          docker build -t zinloop-backup deploy/backup
      - name: Check docker-compose.yml and the deploy scripts
        run: |
          cp .env.example .env && docker compose config -q
          sh -n deploy/deploy.sh && sh -n deploy/backup/backup.sh && sh -n deploy/backup/restore.sh
          bash -n .github/scripts/remote-deploy.sh
      - name: Check the RMM scripts
        run: |
          sh -n scanner/rmm/install-unix.sh
          pwsh -NoProfile -Command '$e=$null; [System.Management.Automation.Language.Parser]::ParseFile("scanner/rmm/install-windows.ps1",[ref]$null,[ref]$e) | Out-Null; if ($e) { $e; exit 1 }'

  # Starts the real docker-compose stack (minus Caddy) and checks health, the
  # background jobs, a backup and a restore of that backup.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build db console maintenance backup
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q console)")" = healthy ] && exit 0
            sleep 5
          done
          echo "console never became healthy"; exit 1
      - name: Health check and background jobs
        run: |
          docker compose exec -T console wget -qO- http://127.0.0.1:3000/api/health | grep -q '"ok":true'
          sleep 20
          docker compose exec -T console wget -qO- 'http://127.0.0.1:3000/api/health?jobs=1' | tee /dev/stderr | grep -q '"ok":true'
      - name: Back up and restore
        run: |
          docker compose exec -T backup backup.sh once
          docker compose exec -T backup sh -c 'restore.sh --check "$(ls -t /backups/*.dump | head -1)"'
      - name: Encrypted copies can be restored
        run: |
          docker compose exec -T backup sh -c '
            set -e
            age-keygen -o /tmp/key.txt 2>/dev/null
            age -r "$(age-keygen -y /tmp/key.txt)" -o /tmp/latest.dump.age "$(ls -t /backups/*.dump | head -1)"
            AGE_IDENTITY_FILE=/tmp/key.txt restore.sh --check /tmp/latest.dump.age'
      - name: Logs
        if: failure()
        run: docker compose logs

