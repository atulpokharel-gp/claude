name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Latest stable Go, so builds carry current security fixes.
          go-version: stable
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Check dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Cross-build for Windows, Mac and Linux
        run: |
          for target in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/agentscan
          done

  # Runs the tests on real Windows and macOS, including moving keys into
  # Windows Credential Manager and the macOS Keychain and starting a server
  # through the launcher. Fake keys only; they are deleted afterwards.
  scanner-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - name: Tests, including the real password store
        env:
          AGENTGUARD_REAL_STORE: "1"
        run: go test -v -run "TestRealPasswordStore" ./cmd/agentscan && go test ./...
      - name: Build and run a read-only scan of the test configs
        shell: bash
        run: |
          go build -o agentscan-test${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/agentscan
          ./agentscan-test --home testdata/home --project testdata/project

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build # also generates next-env.d.ts, which typecheck needs
      - run: npm run typecheck
